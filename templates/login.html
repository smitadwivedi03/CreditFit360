<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07080d">
    <title>CreditFit 360 - Authentication & Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .auth-tab {
            flex: 1;
            padding: 9px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }

        .auth-tab.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        .demo-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.35);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            margin-top: 14px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .demo-login-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        .alert-box {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #6ee7b7;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <div class="logo-icon">✓</div>
            <h1>CreditFit <span>360</span></h1>
        </div>

        <p class="subtitle">
            Understand. Improve. Empower.
        </p>

        <!-- Toggle Tabs -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
            <button type="button" class="auth-tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleAuth(event, 'login')">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required value="demo@creditfit360.com">

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required value="Demo@123">

            <div class="login-options">
                <label class="remember">
                    <input type="checkbox" checked>
                    Remember me
                </label>
                <a href="javascript:void(0)" onclick="quickDemo()">Use Demo Password</a>
            </div>

            <button type="submit" id="loginSubmitBtn">Sign In →</button>
        </form>

        <!-- REGISTRATION FORM (Hidden by default) -->
        <form id="registerForm" style="display:none;" onsubmit="handleAuth(event, 'register')">
            <label>Full Legal Name</label>
            <input type="text" id="regName" placeholder="e.g. Smita Dwivedi" required>

            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="Enter your email" required>

            <label>Mobile Number (For AA / OTP)</label>
            <input type="tel" id="regPhone" placeholder="+91 98765 43210">

            <label>Create Password</label>
            <input type="password" id="regPassword" placeholder="At least 6 characters" required>

            <button type="submit" id="regSubmitBtn" style="margin-top:14px;">Create Verified Account →</button>
        </form>

        <a href="javascript:void(0)" onclick="quickDemo()" class="demo-login-btn">
            <span>⚡</span> 1-Click Demo Login (Preloaded Data)
        </a>

        <div class="divider">
            <span>OR</span>
        </div>

        <a href="/dashboard" class="google-btn">
            <span>🚀 Continue as Guest Explorer →</span>
        </a>

        <p class="signup" style="font-size:11.5px; color:#64748b; margin-top:20px;">
            🔒 Protected under India's Digital Personal Data Protection Act 2023.
        </p>

    </div>

</div>

<script>
    function switchTab(mode) {
        const tabLogin = document.getElementById("tabLogin");
        const tabRegister = document.getElementById("tabRegister");
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const alertBox = document.getElementById("alertBox");
        alertBox.style.display = "none";

        if (mode === 'login') {
            tabLogin.classList.add("active");
            tabRegister.classList.remove("active");
            loginForm.style.display = "block";
            registerForm.style.display = "none";
        } else {
            tabRegister.classList.add("active");
            tabLogin.classList.remove("active");
            loginForm.style.display = "none";
            registerForm.style.display = "block";
        }
    }

    async function quickDemo() {
        document.getElementById("loginEmail").value = "demo@creditfit360.com";
        document.getElementById("loginPassword").value = "Demo@123";
        switchTab('login');
        
        // Auto submit
        const fakeEvent = { preventDefault: () => {} };
        await handleAuth(fakeEvent, 'login');
    }

    async function handleAuth(e, mode) {
        e.preventDefault();
        const alertBox = document.getElementById("alertBox");
        alertBox.style.display = "none";

        let endpoint = mode === 'login' ? "/api/login" : "/api/register";
        let payload = {};

        if (mode === 'login') {
            payload = {
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value
            };
        } else {
            payload = {
                full_name: document.getElementById("regName").value,
                email: document.getElementById("regEmail").value,
                phone: document.getElementById("regPhone").value,
                password: document.getElementById("regPassword").value
            };
        }

        try {
            const res = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (data.success) {
                alertBox.className = "alert-box alert-success";
                alertBox.innerText = "✓ " + (data.message || "Authentication successful! Redirecting...");
                alertBox.style.display = "block";
                setTimeout(() => {
                    window.location.href = "/dashboard";
                }, 600);
            } else {
                alertBox.className = "alert-box alert-error";
                alertBox.innerText = "⚠️ " + (data.message || "Failed to authenticate.");
                alertBox.style.display = "block";
            }
        } catch (err) {
            alertBox.className = "alert-box alert-error";
            alertBox.innerText = "⚠️ Network error connecting to authentication service.";
            alertBox.style.display = "block";
        }
    }
</script>

</body>
</html>
